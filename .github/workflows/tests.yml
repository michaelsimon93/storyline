name: Tests

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Deployed migrations are frozen
        run: bash scripts/check-migrations.test.sh && bash scripts/check-migrations.sh
      - name: Run migration + scenario tests
        run: bash supabase/tests/run.sh

  real-supabase:
    # Same scenario tests, but against a real local Supabase stack, so differences
    # between our stand-ins and Supabase (auth, default privileges) can't hide bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (database + auth only)
        run: supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - name: Run scenario tests against real Supabase
        env:
          REAL_SUPABASE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/run.sh

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
