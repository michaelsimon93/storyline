name: Tests

on:
  # Branches are tested by their PR; pushes only run on main (after a merge).
  push:
    branches: [main]
  pull_request:

jobs:
  # Works out which test jobs a PR can affect. Must stay a required check:
  # if it fails on a PR, the test jobs are skipped, and skipped counts as passing.
  # Pushes to main run every test job even if this job fails.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.filter.outputs.db }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'scripts/**'
              - '.github/workflows/tests.yml'
            worker:
              - 'worker/**'
              # Worker integration tests apply the migrations and Supabase stubs.
              - 'supabase/**'
              - '.github/workflows/tests.yml'

  schema:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.db == 'true')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations on main are frozen (PRs)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          bash scripts/check-migrations-frozen.test.sh
          bash scripts/check-migrations-frozen.sh "origin/${{ github.base_ref }}"
      - name: Run migration + scenario tests
        run: bash supabase/tests/run.sh

  real-supabase:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.db == 'true')) }}
    # Same scenario tests, but against a real local Supabase stack, so differences
    # between our stand-ins and Supabase (auth, default privileges) can't hide bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0   # pinned: CI results shouldn't change without a code change
      - name: Start Supabase (database + auth only)
        run: supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - name: Run scenario tests against real Supabase
        env:
          REAL_SUPABASE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/run.sh

  worker:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.worker == 'true')) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

  # Merged = deployed (STO-130). After main's tests pass, apply any new migrations to Supabase.
  # Railway's "Wait for CI" holds the worker deploy until this workflow finishes, and the worker
  # also waits for its schema at startup (worker/src/lib/schema.ts) in case it doesn't.
  migrate:
    needs: [schema, real-supabase, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-production
      cancel-in-progress: false   # never cut a migration off halfway
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Apply new migrations
        env:
          # Session pooler URL ending in ?sslmode=require (docs/runbook-deploy.md §2). Only here, never in a session.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::The SUPABASE_DB_URL repository secret isn't set"; exit 1; fi
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
          supabase migration list --db-url "$SUPABASE_DB_URL"
